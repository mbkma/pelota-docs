# Hugo configuration of the Pelota documentation (theme: Hextra)
title: Pelota
baseURL: https://mbkma.github.io/pelota-docs/

enableRobotsTXT: true
enableGitInfo: false
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

module:
  imports:
    - path: github.com/imfing/hextra

summaryLength: 50

outputs:
  home: [html, rss]
  page: [html]
  section: [html, rss]

markup:
  goldmark:
    renderer:
      # Pages use a little raw HTML (figures with captions)
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    noClasses: false

menu:
  main:
    - name: Play
      pageRef: /docs/play
      weight: 1
    - name: How it works
      pageRef: /docs/how-it-works
      weight: 2
    - name: Contribute
      pageRef: /docs/contribute
      weight: 3
    - name: Blog
      pageRef: /blog
      weight: 4
    - name: About
      pageRef: /about
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: https://github.com/mbkma/pelota
      params:
        icon: github

params:
  description: >-
    Pelota is a free and open source 3D tennis game made with Godot. These pages explain how
    to play, how the game works inside, and how you can help build it.

  displayUpdatedDate: false
  dateFormat: January 2, 2006

  theme:
    default: dark
    displayToggle: true

  imageZoom:
    enable: true

  externalLinkDecoration: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      width: 32
      height: 32

  page:
    displayPagination: true

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: https://github.com/mbkma/pelota-docs/edit/main/content

  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
